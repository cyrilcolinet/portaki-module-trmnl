[package]
name = "trmnl"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Portaki TRMNL module — pushes stay information to a TRMNL e-ink screen"
repository = "https://github.com/cyrilcolinet/portaki-module-trmnl"
rust-version = "1.75"
# L'artefact est une image OCI poussée par `portaki publish`, jamais une crate.
publish = false

[lib]
# `cdylib` pour le wasm chargé par l'hôte, `rlib` pour que `tests/` puisse lier le module.
crate-type = ["cdylib", "rlib"]

[dependencies]
portaki-sdk = "3.2.0"
portaki-sdk-macros = "3.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "rng-getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1.4"

[dev-dependencies]
portaki-test-utils = "3.2.0"
serial_test = "4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
